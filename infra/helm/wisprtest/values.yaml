# Default values. No secrets live here.
#
# Runtime configuration is a Kubernetes Secret named by global.envSecretName.
# `make kind-up` creates it from `.env` with hostnames rewritten for kind.
# A production install creates the same Secret from the deployment's own secret
# store — never from a committed file.

global:
  envSecretName: wisprtest-runtime
  # When set to a reachable IP, every pod gets hostAliases for `localhost`.
  # kind-up sets this to the Compose host so Dex's issuer (http://localhost:5556/dex)
  # is reachable from inside the cluster. Leave empty to skip.
  hostAliasIP: ''
  imagePullPolicy: IfNotPresent

gateway:
  enabled: true
  replicaCount: 1
  image:
    repository: wisprtest/gateway
    tag: kind
  service:
    type: ClusterIP
    port: 8080
  containerPort: 8080
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    maxUnavailable: 1
  probes:
    livenessPath: /healthz
    readinessPath: /readyz
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  extraEnv:
    GATEWAY_HOST: '0.0.0.0'
    OTEL_SERVICE_NAME: wispr-gateway

indexer:
  enabled: true
  replicaCount: 1
  image:
    repository: wisprtest/indexer
    tag: kind
  service:
    type: ClusterIP
    port: 8081
  containerPort: 8081
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 2Gi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    maxUnavailable: 1
  probes:
    livenessPath: /healthz
    readinessPath: /readyz
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  extraEnv:
    INDEXER_HOST: '0.0.0.0'
    OTEL_SERVICE_NAME: wispr-indexer
    INDEXER_SECRET_ROOT: /var/wispr/secrets
    INDEXER_HEADLESS: 'true'
  shmSizeLimit: 2Gi

composer:
  enabled: true
  replicaCount: 1
  image:
    repository: wisprtest/composer
    tag: kind
  service:
    type: ClusterIP
    port: 8090
  containerPort: 8090
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    maxUnavailable: 1
  probes:
    livenessPath: /healthz
    readinessPath: /readyz
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  extraEnv:
    COMPOSER_HOST: '0.0.0.0'

console:
  enabled: true
  replicaCount: 1
  image:
    repository: wisprtest/console
    tag: kind
  service:
    type: ClusterIP
    port: 3000
    nodePort: 30000
  containerPort: 3000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    maxUnavailable: 1
  probes:
    livenessPath: /api/healthz
    readinessPath: /api/readyz
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  extraEnv:
    HOSTNAME: '0.0.0.0'
    PORT: '3000'
    CONSOLE_PORT: '3000'
