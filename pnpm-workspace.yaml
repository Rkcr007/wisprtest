packages:
  - packages/*
  - apps/*

# pnpm refuses to run dependency lifecycle scripts unless they are named here.
# Keep this list minimal and justify every entry.
allowBuilds:
  protobufjs: true # OTel's OTLP encoder; postinstall only generates its own type shims
  esbuild: true # vite/vitest transform pipeline; ships a platform binary
  sharp: true # next.js image optimisation; native binding

# pnpm withholds releases younger than its minimum-release-age gate. eslint 10.8.0 is the
# version this scaffold is pinned to and typescript-eslint 8.65 declares support for it.
minimumReleaseAgeExclude:
  - eslint@10.8.0
  - undici@8.9.0
  - sharp@0.35.0
  - postcss@8.5.23
  - fast-uri@4.1.2
  - fast-uri@3.1.5
  - brace-expansion@5.0.9
  - js-yaml@4.3.1
  - nanoid@3.3.18
  - '@opentelemetry/core@2.8.0'

overrides:
  '@opentelemetry/core@<2.8.0': ^2.8.0
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  fast-uri@>=4.0.0 <4.1.2: ^4.1.2
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  nanoid@<3.3.18: ^3.3.18
  postcss@<8.5.23: ^8.5.23
  sharp@<0.35.0: ^0.35.0
