name: setup
description: Node, pnpm, uv and every workspace dependency, restored from cache where possible.

# Extracted into a composite action because seven jobs need exactly this and a drifted copy in one
# of them would mean that job tests a different dependency tree from the rest.

runs:
  using: composite
  steps:
    # Reads the version from the `packageManager` field in package.json, so the pinned pnpm here
    # cannot drift from the one developers run. Must precede setup-node, which needs pnpm present
    # to resolve its cache directory.
    - name: install pnpm
      uses: pnpm/action-setup@v4

    - name: install node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: install workspace dependencies
      shell: bash
      # --frozen-lockfile: a lockfile that does not match package.json fails the build rather than
      # being silently resolved into something no developer has run.
      run: pnpm install --frozen-lockfile

    # `packages/protocol`, `packages/fingerprint` and `packages/ui` are each consumed through
    # `./dist/index.d.ts`, and `dist/` is gitignored. On a fresh checkout none of it exists, so
    # every `import ... from 'protocol'` in the apps resolves to nothing and the types of every
    # consumer silently degrade to `any`. That does not show up as a missing-module error — it
    # surfaces as a wall of `no-unsafe-member-access` / "type that cannot be resolved" lint
    # failures in files nobody touched, which is a genuinely confusing way to learn you forgot to
    # build. A working tree that has ever run `pnpm build` cannot reproduce it.
    #
    # Only the workspace packages are built. The apps are built by the jobs that need them
    # (`extension` builds itself in e2e), and `make build` is deliberately not used here because
    # it runs `db-codegen`, which needs a live database that `lint` and `typecheck` do not.
    - name: build the workspace packages
      shell: bash
      # pnpm orders filtered scripts topologically, so protocol is built before its dependents.
      run: pnpm --filter "./packages/*" build

    - name: install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: apps/composer/uv.lock

    - name: install composer dependencies
      shell: bash
      # --frozen for the same reason as pnpm's --frozen-lockfile above.
      run: uv sync --project apps/composer --frozen
