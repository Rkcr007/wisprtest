# Prometheus — the store behind the dashboards and the alert rules.
#
# It scrapes the collector rather than the services directly, and that is deliberate: the services
# speak OTLP and push, which means nothing has to discover them. In Compose that is a convenience;
# in GKE Autopilot it is the difference between working and not, because a scrape target inside a
# cluster needs service discovery and RBAC that a push does not.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    # Stamped onto every series that leaves here, so a pilot and a laptop are distinguishable once
    # both are pointed at the same place. `docs/GCP-DEPLOYMENT.md` runs a single region; this is
    # what keeps that from becoming an assumption.
    deployment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Application telemetry, converted from OTLP by the collector.
  - job_name: wispr-services
    static_configs:
      - targets: ['otel-collector:8889']

  # The collector's own health. Without this, "no data" and "collector is dropping everything"
  # look identical on every dashboard in this repo.
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
