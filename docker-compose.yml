name: wisprtest

# Image tags are pinned to exact patch versions rather than floating tags. Phase 19 turns the
# latency budgets in CLAUDE.md into release gates, and a benchmark gate is only meaningful if the
# stack underneath it is reproducible across machines and CI.

services:
  postgres:
    image: postgres:16.14
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required — copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      # Deterministic collation so index ordering matches production regardless of host locale.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:?POSTGRES_PORT is required}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4.5
    restart: unless-stopped
    # Append-only persistence so a restart does not silently drop queued crawl jobs.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:?REDIS_PORT is required}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    ports:
      - '${QDRANT_PORT:?QDRANT_PORT is required}:6333'
      - '${QDRANT_GRPC_PORT:?QDRANT_GRPC_PORT is required}:6334'
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The qdrant image ships neither curl nor wget, so probe the REST port over bash's
      # /dev/tcp and require a real HTTP 200 from /healthz. bash is invoked explicitly because
      # CMD-SHELL runs dash, which has no /dev/tcp support.
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /healthz HTTP/1.0\r\n\r\n" >&3 && head -n 1 <&3 | grep -q "200 OK"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Object storage for session evidence — screenshots and DOM snapshots (docs/BUILD-PLAN.md
  # Phase 12). The database holds only the reference and the content hash; the bytes live here,
  # and are served to the console as short-lived signed URLs so no credential ever reaches it.
  #
  # MinIO is S3-compatible, so the gateway talks to it through the ordinary AWS SDK and moving to
  # managed object storage in production (ARCHITECTURE § 9) is a change of endpoint and keys, not
  # of code.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${EVIDENCE_ACCESS_KEY_ID:?EVIDENCE_ACCESS_KEY_ID is required — copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${EVIDENCE_SECRET_ACCESS_KEY:?EVIDENCE_SECRET_ACCESS_KEY is required}
    ports:
      - '${EVIDENCE_PORT:?EVIDENCE_PORT is required}:9000'
      - '${EVIDENCE_CONSOLE_PORT:?EVIDENCE_CONSOLE_PORT is required}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      # The minio image ships no curl, no wget and — unlike qdrant's — no grep either, so the
      # status line is matched with bash's own pattern matching rather than piped to anything. The
      # `$$` escapes the shell variable so compose does not try to interpolate it.
      # HTTP/1.1 with a Host header, not 1.0: MinIO answers a hostless request with a 400, so the
      # simpler probe qdrant uses would report a healthy server as permanently unhealthy.
      # `/minio/health/live` answers before the bucket exists, which is what readiness means here:
      # the gateway creates the bucket at boot.
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r line <&3 && [[ $$line == *"200 OK"* ]]',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
