name: wisprtest

# Image tags are pinned to exact patch versions rather than floating tags. Phase 19 turns the
# latency budgets in CLAUDE.md into release gates, and a benchmark gate is only meaningful if the
# stack underneath it is reproducible across machines and CI.

services:
  postgres:
    image: postgres:16.14
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required — copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      # Deterministic collation so index ordering matches production regardless of host locale.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:?POSTGRES_PORT is required}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4.5
    restart: unless-stopped
    # Append-only persistence so a restart does not silently drop queued crawl jobs.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:?REDIS_PORT is required}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    ports:
      - '${QDRANT_PORT:?QDRANT_PORT is required}:6333'
      - '${QDRANT_GRPC_PORT:?QDRANT_GRPC_PORT is required}:6334'
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The qdrant image ships neither curl nor wget, so probe the REST port over bash's
      # /dev/tcp and require a real HTTP 200 from /healthz. bash is invoked explicitly because
      # CMD-SHELL runs dash, which has no /dev/tcp support.
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /healthz HTTP/1.0\r\n\r\n" >&3 && head -n 1 <&3 | grep -q "200 OK"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
