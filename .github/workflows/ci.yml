name: CI

# Every gate in CLAUDE.md that can be checked by a machine is checked here, and nothing merges
# to main without them. The jobs are split by what they need rather than by package: `lint`,
# `typecheck` and `unit` need nothing but a runtime, so they finish fast and fail fast;
# `integration`, `e2e` and `bench` pay for the Compose stack and run in parallel with each other.
#
# The Compose stack is the same `docker compose` file used locally, brought up with the same
# `make db-up`. Service containers were the alternative and were rejected: a second definition of
# the infrastructure is a second thing to keep in step with the first, and the benchmark gates
# below are only meaningful if the stack underneath them matches the one developers measure on.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A force-push to a PR branch makes the in-flight run for that branch worthless. Cancel it rather
# than paying for a result nobody will read. `main` is exempt — those runs gate the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Fail on the first ANSI-coloured surprise rather than debugging a mangled log.
  FORCE_COLOR: '1'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: eslint, prettier and ruff
        run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Covers `tsc --noEmit` across every TS package AND `mypy --strict` for the composer,
      # per CLAUDE.md rule #8.
      - name: tsc --noEmit and mypy --strict
        run: pnpm typecheck

  unit:
    name: unit tests and coverage gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Run per package rather than via the root `pnpm test`: the gateway's `test` script chains
      # the four Compose-backed suites, which belong to the `integration` job below.
      #
      # The coverage gates run here rather than in a job of their own. `packages/protocol` and
      # `packages/fingerprint` both set `coverage.enabled: true` with explicit thresholds, so
      # their ordinary `test` script already fails on a coverage regression. A separate job would
      # re-run the same suites to enforce a threshold they have already enforced.
      - name: protocol, fingerprint, ui — including coverage thresholds
        run: pnpm --filter protocol --filter fingerprint --filter ui test

      - name: extension
        run: pnpm --filter extension test

      - name: indexer
        run: pnpm --filter indexer test

      - name: gateway
        run: pnpm --filter gateway exec vitest run

      - name: console
        run: pnpm --filter console test

      - name: composer
        run: uv run --project apps/composer pytest -q

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/stack

      - name: gateway — database and row-level security
        run: pnpm --filter gateway test:db

      - name: gateway — memory snapshot
        run: pnpm --filter gateway test:memory

      - name: gateway — T2 escalation
        run: pnpm --filter gateway test:resolve

      - name: gateway — sessions and evidence
        run: pnpm --filter gateway test:sessions

      - name: indexer — crawl and observers against the fixture app
        run: |
          pnpm --filter indexer exec playwright install --with-deps chromium
          pnpm --filter indexer test:e2e

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/stack

      - name: install chromium
        run: pnpm --filter extension exec playwright install --with-deps chromium

      - name: extension — HUD mounts and drags
        run: pnpm --filter extension test:e2e

      - name: extension — spoken command drives the fixture app
        run: pnpm --filter extension test:e2e:command

      - name: extension — resolution against the indexed fixture app
        run: pnpm --filter extension test:resolver

      # The compounding asset, per CLAUDE.md § "Resolution tiers": an unknown phrasing resolves at
      # T2, the alias is written back, and the same phrasing then resolves at T0. If this breaks,
      # what is left is a slower competitor.
      - name: extension — T2 alias write-back loop
        run: pnpm --filter extension test:writeback-loop

  bench:
    name: performance gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/stack

      - name: install chromium
        run: pnpm --filter extension exec playwright install --with-deps chromium

      # These assert the budgets in CLAUDE.md § "Performance budgets". They are tests, not
      # aspirations — a regression fails the build rather than filing a ticket.
      - name: scoped index recompute — under 8ms at 3000 nodes
        run: pnpm --filter extension bench:scope

      - name: T0 resolution — under 15ms p99
        run: pnpm --filter extension bench:resolve

      - name: speech onset to reticle — under 400ms p95
        run: pnpm --filter extension bench:speech-to-reticle

  # A single required check for branch protection. Adding a job above does not require editing the
  # protection rule, and a job that is skipped or cancelled fails this gate rather than silently
  # counting as success — `needs` alone would treat a skipped dependency as satisfied.
  ci:
    name: ci
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, typecheck, unit, integration, e2e, bench]
    steps:
      - name: verify every gate passed
        run: |
          echo '${{ toJSON(needs) }}' \
            | jq -e 'to_entries | map(select(.value.result != "success")) as $failed
                     | if ($failed | length) == 0 then true
                       else ($failed | map("\(.key): \(.value.result)") | join("\n")) as $msg
                            | error("failed gates:\n" + $msg) end'
