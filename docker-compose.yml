name: wisprtest

# Image tags are pinned to exact patch versions rather than floating tags. Phase 19 turns the
# latency budgets in CLAUDE.md into release gates, and a benchmark gate is only meaningful if the
# stack underneath it is reproducible across machines and CI.

services:
  postgres:
    image: postgres:16.14
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required — copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      # Deterministic collation so index ordering matches production regardless of host locale.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:?POSTGRES_PORT is required}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4.5
    restart: unless-stopped
    # Append-only persistence so a restart does not silently drop queued crawl jobs.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:?REDIS_PORT is required}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    ports:
      - '${QDRANT_PORT:?QDRANT_PORT is required}:6333'
      - '${QDRANT_GRPC_PORT:?QDRANT_GRPC_PORT is required}:6334'
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The qdrant image ships neither curl nor wget, so probe the REST port over bash's
      # /dev/tcp and require a real HTTP 200 from /healthz. bash is invoked explicitly because
      # CMD-SHELL runs dash, which has no /dev/tcp support.
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /healthz HTTP/1.0\r\n\r\n" >&3 && head -n 1 <&3 | grep -q "200 OK"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Object storage for session evidence — screenshots and DOM snapshots (docs/BUILD-PLAN.md
  # Phase 12). The database holds only the reference and the content hash; the bytes live here,
  # and are served to the console as short-lived signed URLs so no credential ever reaches it.
  #
  # MinIO is S3-compatible, so the gateway talks to it through the ordinary AWS SDK and moving to
  # managed object storage in production (ARCHITECTURE § 9) is a change of endpoint and keys, not
  # of code.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${EVIDENCE_ACCESS_KEY_ID:?EVIDENCE_ACCESS_KEY_ID is required — copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${EVIDENCE_SECRET_ACCESS_KEY:?EVIDENCE_SECRET_ACCESS_KEY is required}
    ports:
      - '${EVIDENCE_PORT:?EVIDENCE_PORT is required}:9000'
      - '${EVIDENCE_CONSOLE_PORT:?EVIDENCE_CONSOLE_PORT is required}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      # The minio image ships no curl, no wget and — unlike qdrant's — no grep either, so the
      # status line is matched with bash's own pattern matching rather than piped to anything. The
      # `$$` escapes the shell variable so compose does not try to interpolate it.
      # HTTP/1.1 with a Host header, not 1.0: MinIO answers a hostless request with a 400, so the
      # simpler probe qdrant uses would report a healthy server as permanently unhealthy.
      # `/minio/health/live` answers before the bucket exists, which is what readiness means here:
      # the gateway creates the bucket at boot.
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r line <&3 && [[ $$line == *"200 OK"* ]]',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # The identity provider. The console runs a real authorization-code + PKCE flow and the
  # gateway verifies real OIDC bearer tokens; until this service existed neither could be
  # exercised locally, because nothing in the stack could mint a token. Dex is an actual OIDC
  # provider with a password-database connector — not a mock and not a bypass — so the sign-in
  # path a developer drives by hand is the same one that runs in production, with a different
  # issuer. Its clients, fixture users and the audience decision are in infra/dex/config.yaml.
  dex:
    image: ghcr.io/dexidp/dex:v2.44.0
    restart: unless-stopped
    # The image's default command reads /etc/dex/config.docker.yaml. Named explicitly so the
    # mount path below says what it is rather than matching an image's internal convention.
    command: ['dex', 'serve', '/etc/dex/config.yaml']
    ports:
      # Not freely reassignable: the port is part of the issuer URL, which Dex signs into every
      # token as `iss` and which both the console and the gateway verify. Moving it means moving
      # `issuer` in infra/dex/config.yaml and OIDC_ISSUER_URL in .env at the same time.
      - '${DEX_PORT:?DEX_PORT is required — copy .env.example to .env}:5556'
    volumes:
      - ./infra/dex/config.yaml:/etc/dex/config.yaml:ro
      - dex-data:/var/dex
    healthcheck:
      # Unlike qdrant and minio, this image is Alpine-based and ships busybox wget, so the probe
      # is an ordinary HTTP request. `/dex/healthz` is under the issuer path prefix and checks
      # storage as well as the web server, which is what readiness means here: a Dex that cannot
      # reach its database answers the port but cannot complete a sign-in.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:5556/dex/healthz']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ── Observability ───────────────────────────────────────────────────────────────────────────
  #
  # Behind the `observability` profile, so `make dev` stays a light loop and `make obs-up` brings
  # these three up when you want to watch something. Every service in this repo has been
  # instrumented since Phase 12 and exporting to nothing; these are what receive it.
  #
  # The data plane above is shared by every git worktree on the machine (CLAUDE.md § "Parallel
  # tracks"), and so is this: one collector, one Prometheus, one Grafana, whichever worktree
  # started them.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    profiles: ['observability']
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # What `OTEL_EXPORTER_OTLP_ENDPOINT` points at. Published to the host because the services
      # run there under `make dev`, not in Compose.
      - '${OTEL_COLLECTOR_HTTP_PORT:?OTEL_COLLECTOR_HTTP_PORT is required — copy .env.example to .env}:4318'
      - '${OTEL_COLLECTOR_GRPC_PORT:?OTEL_COLLECTOR_GRPC_PORT is required}:4317'
    healthcheck:
      # The contrib image is distroless — no shell, no wget, no curl. The collector's own
      # health_check extension is the only probe available, and it is the right one anyway: it
      # reports the pipeline's state rather than whether a port is open.
      test: ['CMD', '/otelcol-contrib', 'components']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ['observability']
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Long enough to see a week-over-week trend on the release gate, short enough that a laptop
      # does not accumulate a database nobody prunes.
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - '${PROMETHEUS_PORT:?PROMETHEUS_PORT is required}:9090'
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  grafana:
    image: grafana/grafana:11.5.1
    profiles: ['observability']
    restart: unless-stopped
    environment:
      # A local stack with fixture data. Anonymous admin removes a login that would otherwise be
      # one more credential to document, and this port is never exposed off the machine. The GCP
      # pilot uses Grafana Cloud or an IAP-fronted instance — see docs/GCP-DEPLOYMENT.md — so this
      # setting does not travel.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_DEFAULT_THEME: light
      # Nothing here should phone home from a machine holding customer-shaped fixture data.
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # 3000 is the console's.
      - '${GRAFANA_PORT:?GRAFANA_PORT is required}:3000'
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
  # Dex's signing keys, refresh tokens and in-flight auth requests. Persisted so a restart does
  # not rotate the key every issued token was signed with.
  dex-data:
  prometheus-data:
  grafana-data:
