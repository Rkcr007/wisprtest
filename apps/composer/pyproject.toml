[project]
name = "composer"
version = "0.0.0"
description = "WisprTest composer — schema inference, constraint solving, composition planning."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.0",
    "pydantic>=2.12.0",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "mypy>=1.19.0",
    "pytest>=9.0.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composer"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
# CLAUDE.md rule #8: no `any`, no bare `dict`. `disallow_any_generics` is what forbids the bare
# `dict`/`list`. `disallow_any_explicit` is deliberately NOT enabled: it fires on the `__init__`
# that the pydantic mypy plugin synthesises for every model, so it would cost an ignore comment
# per model while catching nothing in our own annotations that --strict does not already catch.
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "ANN", # missing annotations — enforces CLAUDE.md rule #8
    "S",   # bandit
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Assertions are the point of a test file.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
