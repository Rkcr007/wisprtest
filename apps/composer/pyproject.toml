[project]
name = "composer"
version = "0.0.0"
description = "WisprTest composer — schema inference, constraint solving, composition planning."
requires-python = ">=3.13"
dependencies = [
    # The official SDK, not raw HTTP. The gateway hand-rolls its Anthropic client over `fetch`
    # because that is what a Node service with no other HTTP dependency wants; a Python service
    # takes the SDK, which brings typed errors, retries and the structured-output helpers.
    "anthropic>=0.116.0",
    "fastapi>=0.121.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-sdk>=1.30.0",
    "pydantic>=2.12.0",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    # Turns packages/protocol's JSON Schema bundle into src/composer/protocol/models.py.
    # A dev dependency, not a runtime one: it runs at build time via
    # `pnpm --filter protocol gen:python`, never inside the service.
    "datamodel-code-generator>=0.71.0",
    "httpx2>=2.9.1",
    # Property-based tests: the phase requires that generated records always satisfy their
    # constraint set and always validate against their schema, over inputs nobody hand-picked.
    "hypothesis>=6.140.0",
    "mypy>=1.19.0",
    "pytest>=9.0.0",
    # Coverage is a gate, not a report. See [tool.pytest.ini_options] below for why it is wired
    # into the default `addopts` rather than left behind a flag someone has to remember.
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composer"]
# PEP 561: the package ships type information, so importers (the test suite, and anything that
# later depends on the composer) typecheck against it rather than treating it as untyped.
artifacts = ["src/composer/py.typed"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
# CLAUDE.md rule #8: no `any`, no bare `dict`. `disallow_any_generics` is what forbids the bare
# `dict`/`list`. `disallow_any_explicit` is deliberately NOT enabled: it fires on the `__init__`
# that the pydantic mypy plugin synthesises for every model, so it would cost an ignore comment
# per model while catching nothing in our own annotations that --strict does not already catch.
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "ANN", # missing annotations — enforces CLAUDE.md rule #8
    "S",   # bandit
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Assertions are the point of a test file.
"tests/**" = ["S101"]
# Generated from packages/protocol. The docstrings and field descriptions are the contract's
# own prose, carried over verbatim from the Zod schemas; enforcing the line limit here would
# mean truncating documentation in a file nobody edits by hand.
#
# S105 flags `SECRET_UNAVAILABLE = "secret_unavailable"` on IndexFailureCode as a hardcoded
# password. It is the opposite: the enum exists to report that a secret could NOT be resolved,
# and the contract has no representation for a credential value at all (see the indexing module
# in packages/protocol). The alternative is renaming a failure code to appease a substring match.
"src/composer/protocol/models.py" = ["E501", "S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is on by default rather than behind a `--cov` someone has to remember, for the same
# reason `packages/fingerprint/vitest.config.ts` turns it on by default on the TypeScript side: a
# gate that only runs when it is asked for is not a gate. `uv run pytest -q` is the command in
# docs/BUILD-PLAN.md's "Done when" and the command CI runs, so it is the one that has to measure.
addopts = """
    --strict-markers
    --cov=composer
    --cov-report=term-missing
    --cov-fail-under=90
"""

[tool.coverage.run]
branch = true
source = ["composer"]
omit = [
    # GENERATED from packages/protocol by `pnpm --filter protocol gen:python`. ~4,950 lines of
    # pydantic models, most of them for parts of the contract this service never touches, and
    # every one of them exercised by pydantic itself rather than by anything written here.
    # Measuring it would move the number a long way without a single extra assertion behind it —
    # the same reasoning `packages/fingerprint/vitest.config.ts` applies to `src/index.ts`.
    "src/composer/protocol/models.py",
    # The uvicorn entrypoint. Its one job is to start a server, and a test that exercised it would
    # be a test of uvicorn. `test_main.py` covers the config-failure path, which is ours.
    "src/composer/__main__.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
